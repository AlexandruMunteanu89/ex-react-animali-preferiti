<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I miei animali Preferiti</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useState } = React;

        const Animali = () => {

            const animalsChoices = ["Cane", "Gatto", "Pappagallo", "Cavallo", "Panda"];

            const [animals, setAnimals] = useState([]);

            const addAnimal = () => {
                const randomAnimalId = Math.floor(Math.random() * animalsChoices.length);
                const randomAnimal = animalsChoices[randomAnimalId];
                setAnimals(curr => [...curr, randomAnimal]);
            }
            return (<>
                <button onClick={addAnimal}>Aggiungi Animale</button>
                <details>
                    <summary>Animali</summary>
                    <ul>
                        {animals.map((animal, index) => (
                            <li key={index}>{animal}</li>
                        ))}
                    </ul>
                </details>
            </>)
        }
    </script>
    <script type="text/babel">
        const { createRoot } = ReactDOM;
        const animali = document.querySelector('.lista-animali');
        const root = createRoot(animali);
        root.render(<Animali/>)
    </script>
</head>
<body>
    <header>
      <h1>I miei animali Preferiti</h1>
    </header>
    <main>
        <figure>
            <img src="https://picsum.photos/400/300" alt="Immagine Casuale">
        </figure>
        <div class="lista-animali"></div>
    </main>
      <footer>
      <p>Creato con amore da... un collega sbadato! 🐾</p>
    </footer>
  </body>
</html>
